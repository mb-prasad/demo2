<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="background" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <main class="login-card">
    <header class="login-header">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l8 4v5c0 5-3.5 8.5-8 9-4.5-.5-8-4-8-9V7l8-4z"/>
        </svg>
      </div>
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to continue to your account</p>
    </header>

    <form class="login-form" action="#" method="post">
      <div class="field">
        <label for="email">Email address</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="M3 7l9 6 9-6"/>
          </svg>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
      </div>

      <div class="field">
        <div class="label-row">
          <label for="password">Password</label>
          <a href="#" class="link small">Forgot password?</a>
        </div>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="11" width="16" height="10" rx="2"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
          </svg>
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
        </div>
      </div>

      <label class="remember">
        <input type="checkbox" name="remember">
        <span>Remember me for 30 days</span>
      </label>

      <button type="submit" class="btn-primary">Sign in</button>
    </form>

    <div class="divider"><span>or continue with</span></div>

    <div class="social-row">
      <button type="button" class="btn-social">Google</button>
      <button type="button" class="btn-social">GitHub</button>
    </div>

    <p class="signup-text">
      Don't have an account? <a href="#" class="link">Create one</a>
    </p>
  </main>
</body>
</html>
